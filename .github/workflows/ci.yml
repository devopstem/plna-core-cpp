name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / C++23
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-17 gcc-13

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'clang' && 'clang++-17' || 'g++-13' }} \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure